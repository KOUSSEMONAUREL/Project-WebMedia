version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'frontend'
    groups:
      frontend-all:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'backend'
    groups:
      backend-all:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/scrapers/webtoons'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'scraper'
    groups:
      scraper-all:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/scrapers/novel-worker'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'scraper'
    groups:
      scraper-all:
        patterns: ['*']

  - package-ecosystem: 'pip'
    directory: '/scrapers/playwright-worker'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'scraper'
    groups:
      scraper-all:
        patterns: ['*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      actions-all:
        patterns: ['*']
