name: diag-net-sites

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

jobs:
  sites:
    name: sites-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native
            network: none
          - name: warp
            network: warp
          - name: vpngate
            network: vpngate

    steps:
      - uses: actions/checkout@v7

      - name: Install opencode
        timeout-minutes: 10
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Build site list
        run: |
          python3 .github/scripts/diag_sites.py > /tmp/sites.txt
          echo "sites=$(wc -l < /tmp/sites.txt)"
          head -5 /tmp/sites.txt

      - name: Probe baseline
        run: |
          set +e
          echo "== baseline ip =="
          curl -4 -sS --max-time 15 https://ifconfig.me || true
          echo
          rm -rf /tmp/probe && mkdir -p /tmp/probe
          export APP_UA
          xargs -P 16 -I{} bash .github/scripts/diag_probe.sh {} < /tmp/sites.txt
          cat /tmp/probe/* | sort > /tmp/sites-baseline.tsv
          echo "== summary baseline =="
          python3 .github/scripts/diag_summary.py /tmp/sites-baseline.tsv

      - name: WARP setup
        if: matrix.network == 'warp'
        timeout-minutes: 12
        run: |
          set +e
          before=$(curl -sS --max-time 15 https://ifconfig.me || true)
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo systemctl start warp-svc
          sleep 2
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status
          after=$(curl -sS --max-time 15 https://ifconfig.me || true)
          echo "before=$before after=$after"
          if [ "$before" = "$after" ]; then
            echo "WARP did not change the public IP"
            exit 1
          fi

      - name: VPNGate setup
        if: matrix.network == 'vpngate'
        timeout-minutes: 15
        run: |
          set +e
          before=$(curl -sS --max-time 15 https://ifconfig.me || true)
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          curl -fsSL https://github.com/KOUSSEMON-Aurel/vpngate/releases/download/v1.0.5/vpngate_1.0.5_linux_amd64.tar.gz -o /tmp/vpngate.tar.gz
          rm -rf /tmp/vpngate-bin && mkdir -p /tmp/vpngate-bin
          tar xzf /tmp/vpngate.tar.gz -C /tmp/vpngate-bin
          sudo install -m 0755 /tmp/vpngate-bin/vpngate /usr/local/bin/vpngate
          vpngate --version || true
          connected=0
          for c in us jp nl de; do
            echo "Trying country $c"
            sudo vpngate disconnect >/dev/null 2>&1 || true
            timeout 120 sudo vpngate connect -d --best --tui=false --refresh --source vpngate --country "$c" --health-timeout 5s --health-concurrency 10 --watch=false --tunnel-health-check=false || true
            for i in $(seq 1 20); do
              s=$(sudo vpngate status 2>&1 || true)
              echo "$s"
              if echo "$s" | grep -qi "connected"; then
                connected=1
                break
              fi
              sleep 3
            done
            if [ "$connected" = 1 ]; then
              echo "VPNGate connected via $c"
              break
            fi
            echo "VPNGate failed via $c"
            sudo vpngate logs 2>&1 | tail -20 || true
          done
          after=$(curl -sS --max-time 20 https://ifconfig.me || true)
          echo "before=$before after=$after"
          if [ "$connected" != 1 ]; then
            echo "VPNGate is not connected"
            sudo vpngate status || true
            sudo vpngate logs 2>&1 | tail -40 || true
            exit 1
          fi
          echo "== tunnel checks =="
          curl -4 -sS --max-time 20 -D - https://ifconfig.me -o /tmp/ifconfig.body || true
          head -c 200 /tmp/ifconfig.body 2>/dev/null || true
          echo
          curl -4 -sS --max-time 20 -D - https://opencode.ai -o /dev/null || true
          if [ "$before" = "$after" ]; then
            echo "VPNGate did not change the public IP"
            exit 1
          fi

      - name: Probe post-VPN
        if: matrix.network != 'none'
        run: |
          set +e
          echo "== post-vpn ip =="
          curl -sS --max-time 15 https://ifconfig.me || true
          echo
          rm -rf /tmp/probe && mkdir -p /tmp/probe
          export APP_UA
          xargs -P 16 -I{} bash .github/scripts/diag_probe.sh {} < /tmp/sites.txt
          cat /tmp/probe/* | sort > /tmp/sites-post.tsv
          echo "== summary post-vpn =="
          python3 .github/scripts/diag_summary.py /tmp/sites-post.tsv

      - name: Free model probes
        timeout-minutes: 10
        run: |
          set +e
          echo "== auth =="
          opencode auth list 2>&1 || true
          run_model() {
            local tag="$1" model="$2" tmo="$3"
            local home="/tmp/oc-$tag"
            rm -rf "$home"; mkdir -p "$home/.config/opencode" "$home/.local/share"
            out=$(timeout -k 3s "$tmo" env HOME="$home" XDG_DATA_HOME="$home/.local/share" XDG_CONFIG_HOME="$home/.config" opencode run --print-logs --log-level ERROR --model "$model" "reply with the single word: pong" 2>&1)
            rc=$?
            if echo "$out" | grep -qw pong; then status=OK; else status=KO; fi
            err=$(echo "$out" | grep -oE 'Free usage limit reached|AI_[A-Za-z]+Error|429|high demand|Endpoint is unavailable|Unauthorized|401|403' | head -1)
            echo "MODEL network=${{ matrix.name }} model=$model status=$status rc=$rc err=$err"
            echo "$out" | grep -iE 'Free usage|AI_|agent=title|pong|429|401|403|error' | tail -5 || true
          }
          run_model deepseek opencode/deepseek-v4.1-flash-free 30
          run_model glm opencode/glm-5.3-flash-free 30
          run_model nemotron-ultra opencode/nemotron-3-ultra-free 30
          run_model nemotron-vl opencode/nemotron-3.5-super-vl-free 30

      - name: Upload site results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sites-${{ matrix.name }}
          path: |
            /tmp/sites-baseline.tsv
            /tmp/sites-post.tsv
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          sudo vpngate disconnect >/dev/null 2>&1 || true
          sudo warp-cli --accept-tos disconnect >/dev/null 2>&1 || true

  rotate:
    name: rotate-warp
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install opencode
        timeout-minutes: 10
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: WARP setup
        timeout-minutes: 12
        run: |
          set +e
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo systemctl start warp-svc
          sleep 2
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status

      - name: Rotate WARP and probe free models
        timeout-minutes: 18
        run: |
          set +e
          smoke() {
            local attempt="$1" model="$2" ip="$3"
            local home="/tmp/rot-$attempt-$model"
            rm -rf "$home"; mkdir -p "$home/.config/opencode" "$home/.local/share"
            out=$(timeout -k 3s 25s env HOME="$home" XDG_DATA_HOME="$home/.local/share" XDG_CONFIG_HOME="$home/.config" opencode run --print-logs --log-level ERROR --model "opencode/$model" "reply with the single word: pong" 2>&1)
            rc=$?
            if echo "$out" | grep -qw pong; then status=OK; else status=KO; fi
            err=$(echo "$out" | grep -oE 'Free usage limit reached|AI_[A-Za-z]+Error|429|high demand|Endpoint is unavailable' | head -1)
            echo "ROTATE attempt=$attempt ip=$ip model=$model status=$status rc=$rc err=$err"
          }
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              sudo warp-cli --accept-tos disconnect || true
              sudo warp-cli --accept-tos registration new || true
              sudo warp-cli --accept-tos connect || true
              sleep 5
            fi
            ip=$(curl -sS --max-time 15 https://ifconfig.me || true)
            echo "=== ROTATE attempt=$attempt ip=$ip ==="
            for model in deepseek-v4.1-flash-free glm-5.3-flash-free nemotron-3-ultra-free nemotron-3.5-super-vl-free; do
              smoke "$attempt" "$model" "$ip"
            done
          done

      - name: Cleanup
        if: always()
        run: |
          sudo warp-cli --accept-tos disconnect >/dev/null 2>&1 || true
