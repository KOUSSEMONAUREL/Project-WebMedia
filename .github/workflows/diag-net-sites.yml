name: diag-net-sites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diag-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native
            network: none
          - name: warp
            network: warp
          - name: vpngate
            network: vpngate

    steps:
      - uses: actions/checkout@v7

      - name: Install opencode
        timeout-minutes: 10
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Baseline network and sites
        run: |
          set +e
          echo "== baseline ip =="
          curl -4 -sS --max-time 15 https://ifconfig.me || true
          echo
          curl -sS --max-time 15 https://ipinfo.io/json | head -20 || true
          echo
          URLS=(
            "https://globalcomix.com"
            "https://inkrush.site"
            "https://lunarx.to"
            "https://mangadot.net"
            "https://mangaomega.com"
            "https://nhentai.com"
            "https://hentairead.com"
            "https://mahouirexnohentaikarte.com"
            "https://mangalix.com"
            "https://oriyami.com"
            "https://rubycomics.net"
            "https://www.voyce.me"
            "https://webtoonclub.com"
            "https://kiutaku.com"
            "https://baobua.net"
            "https://mangafire.to"
            "https://api.github.com"
            "https://raw.githubusercontent.com/keiyoushi/extensions-source/main/README.md"
            "https://opencode.ai"
          )
          probe_all() {
            local label="$1"
            echo "=== SITES $label ==="
            local url hdr body res4 rc4 flags cf
            for url in "${URLS[@]}"; do
              hdr=$(mktemp); body=$(mktemp)
              res4=$(curl -4 -sS -L --max-time 20 -D "$hdr" -o "$body" -w '%{http_code} %{size_download} %{time_total}' "$url" 2>/dev/null)
              rc4=$?
              if [ $rc4 -ne 0 ]; then res4="ERR($rc4) 0 0"; fi
              flags=$(grep -iEo 'just a moment|cf-chl|attention required|access denied|error code: 1026|enable javascript|cloudflare' "$body" 2>/dev/null | sort -u | tr '\n' ',' | sed 's/,$//')
              cf=$(grep -iE '^(server|cf-ray|cf-mitigated):' "$hdr" 2>/dev/null | tr '\n' ';' | tr -d '\r')
              echo "$url|v4=$res4|cf=$cf|body=$flags"
              rm -f "$hdr" "$body"
            done
          }
          probe_all baseline

      - name: WARP setup
        if: matrix.network == 'warp'
        timeout-minutes: 12
        run: |
          set +e
          before=$(curl -sS --max-time 15 https://ifconfig.me || true)
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo systemctl start warp-svc
          sleep 2
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status
          after=$(curl -sS --max-time 15 https://ifconfig.me || true)
          echo "before=$before after=$after"
          if [ "$before" = "$after" ]; then
            echo "WARP did not change the public IP"
            exit 1
          fi

      - name: VPNGate setup
        if: matrix.network == 'vpngate'
        timeout-minutes: 15
        run: |
          set +e
          before=$(curl -sS --max-time 15 https://ifconfig.me || true)
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          curl -fsSL https://github.com/KOUSSEMON-Aurel/vpngate/releases/download/v1.0.5/vpngate_1.0.5_linux_amd64.tar.gz -o /tmp/vpngate.tar.gz
          rm -rf /tmp/vpngate-bin && mkdir -p /tmp/vpngate-bin
          tar xzf /tmp/vpngate.tar.gz -C /tmp/vpngate-bin
          sudo install -m 0755 /tmp/vpngate-bin/vpngate /usr/local/bin/vpngate
          vpngate --version || true
          connected=0
          for c in us jp nl de; do
            echo "Trying country $c"
            sudo vpngate disconnect >/dev/null 2>&1 || true
            timeout 120 sudo vpngate connect -d --best --tui=false --refresh --source vpngate --country "$c" --health-timeout 5s --health-concurrency 10 --watch=false --tunnel-health-check=false || true
            for i in $(seq 1 20); do
              s=$(sudo vpngate status 2>&1 || true)
              echo "$s"
              if echo "$s" | grep -qi "connected"; then
                connected=1
                break
              fi
              sleep 3
            done
            if [ "$connected" = 1 ]; then
              echo "VPNGate connected via $c"
              break
            fi
            echo "VPNGate failed via $c"
            sudo vpngate logs 2>&1 | tail -20 || true
          done
          after=$(curl -sS --max-time 20 https://ifconfig.me || true)
          echo "before=$before after=$after"
          if [ "$connected" != 1 ]; then
            echo "VPNGate is not connected"
            sudo vpngate status || true
            sudo vpngate logs 2>&1 | tail -40 || true
            exit 1
          fi
          echo "== tunnel checks =="
          curl -4 -sS --max-time 20 -D - https://ifconfig.me -o /tmp/ifconfig.body || true
          head -c 200 /tmp/ifconfig.body 2>/dev/null || true
          echo
          curl -4 -sS --max-time 20 -D - https://opencode.ai -o /dev/null || true
          if [ "$before" = "$after" ]; then
            echo "VPNGate did not change the public IP"
            exit 1
          fi

      - name: Post-VPN sites
        if: matrix.network != 'none'
        run: |
          set +e
          echo "== post-vpn ip =="
          curl -sS --max-time 15 https://ifconfig.me || true
          echo
          URLS=(
            "https://globalcomix.com"
            "https://inkrush.site"
            "https://lunarx.to"
            "https://mangadot.net"
            "https://mangaomega.com"
            "https://nhentai.com"
            "https://hentairead.com"
            "https://mahouirexnohentaikarte.com"
            "https://mangalix.com"
            "https://oriyami.com"
            "https://rubycomics.net"
            "https://www.voyce.me"
            "https://webtoonclub.com"
            "https://kiutaku.com"
            "https://baobua.net"
            "https://mangafire.to"
            "https://api.github.com"
            "https://raw.githubusercontent.com/keiyoushi/extensions-source/main/README.md"
            "https://opencode.ai"
          )
          probe_all() {
            local label="$1"
            echo "=== SITES $label ==="
            local url hdr body res4 rc4 flags cf
            for url in "${URLS[@]}"; do
              hdr=$(mktemp); body=$(mktemp)
              res4=$(curl -4 -sS -L --max-time 20 -D "$hdr" -o "$body" -w '%{http_code} %{size_download} %{time_total}' "$url" 2>/dev/null)
              rc4=$?
              if [ $rc4 -ne 0 ]; then res4="ERR($rc4) 0 0"; fi
              flags=$(grep -iEo 'just a moment|cf-chl|attention required|access denied|error code: 1026|enable javascript|cloudflare' "$body" 2>/dev/null | sort -u | tr '\n' ',' | sed 's/,$//')
              cf=$(grep -iE '^(server|cf-ray|cf-mitigated):' "$hdr" 2>/dev/null | tr '\n' ';' | tr -d '\r')
              echo "$url|v4=$res4|cf=$cf|body=$flags"
              rm -f "$hdr" "$body"
            done
          }
          probe_all post-vpn

      - name: OpenCode models and runs
        timeout-minutes: 8
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          set +e
          echo "== auth =="
          opencode auth list 2>&1 || true
          echo "== gemini key =="
          if [ -n "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then echo "present"; else echo "absent"; fi
          echo "== models google =="
          opencode models google 2>&1 | grep -iE 'gemini' | head -10 || true
          run_model() {
            local name="$1" model="$2" tmo="$3"
            local home="/tmp/oc-home-$name"
            rm -rf "$home"; mkdir -p "$home/.config/opencode" "$home/.local/share"
            echo "=== MODEL $name: $model ==="
            out=$(timeout -k 5s "$tmo" env HOME="$home" XDG_DATA_HOME="$home/.local/share" XDG_CONFIG_HOME="$home/.config" opencode run --print-logs --log-level ERROR --model "$model" "reply with the single word: pong" 2>&1)
            rc=$?
            echo "exit=$rc"
            echo "$out" | tail -40
            echo "--- key ---"
            echo "$out" | grep -iE "Free usage|AI_|agent=title|pong|429|401|403|error" | tail -15 || true
            echo "--- data dir ---"
            du -sh "$home/.local/share/opencode" 2>/dev/null || true
            find "$home/.local/share/opencode" -maxdepth 3 -type f 2>/dev/null | head -5 || true
          }
          run_model gemini google/gemini-flash-latest 60
          run_model deepseek opencode/deepseek-v4.1-flash-free 45

      - name: Cleanup
        if: always()
        run: |
          sudo vpngate disconnect >/dev/null 2>&1 || true
          sudo warp-cli --accept-tos disconnect >/dev/null 2>&1 || true
