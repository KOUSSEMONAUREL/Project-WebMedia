name: Weekly Maintenance

on:
  schedule:
    - cron: '0 4 * * 0' # Tous les dimanches à 4h UTC
  workflow_dispatch: # Manuel aussi possible

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: cd backend && npm ci
        
      - name: Run Dead Link Checker
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: cd backend && npx tsx src/jobs/check-links.ts

      - name: Cleanup old failed jobs
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: cd backend && npx tsx src/jobs/cleanup-failed-jobs.ts

      - name: Cleanup unsupported types from D1 orchestrator
        env:
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          curl -s -X POST "$INTERNAL_API_URL/api/internal/cleanup/d1-state" \
            -H "x-api-key: $INTERNAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"type":"book"}'
        

