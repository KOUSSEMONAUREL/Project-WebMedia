name: IGDB Identity Backfill

# Remplit en une passe les colonnes d'identite de jeu que l'import quotidien
# n'apporte jamais: il ne traite que les jeux modifies recemment (fraîcheur),
# donc les jeux deja en base restent sans game_type / parent_game_name.
#
# Execute une seule fois, puis peut etre relance: le script ne vise que les
# lignes incompletes et est repris si interrompu.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Nombre max de jeux a traiter (0 = tous)'
        type: string
        default: '0'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scrapers/import-worker/package-lock.json

      - name: Install dependencies
        run: cd scrapers/import-worker && npm ci

      - name: Build
        run: cd scrapers/import-worker && npm run build

      - name: Backfill identity (Neon + Turso)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          BACKFILL_LIMIT: ${{ inputs.limit }}
        run: cd scrapers/import-worker && node dist/backfill-igdb-identity.js
