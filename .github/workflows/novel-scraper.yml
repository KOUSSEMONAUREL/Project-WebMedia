name: Novel Scraper
on:
  schedule:
    - cron: '40 8,20 * * *'
  workflow_dispatch:
    inputs:
      title:
        description: 'Titre specifique a rechercher (optionnel)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install lncrawl
        run: pip install lightnovel-crawler
      - name: Install dependencies
        run: cd scrapers/novel-worker && npm ci
      - name: Run Novel Worker
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          LNCRAWL_PATH: lncrawl
          SCRAPER_TITLE: ${{ inputs.title || '' }}
        run: |
          if [ -n "$SCRAPER_TITLE" ]; then
            cd scrapers/novel-worker && npx tsx src/index.ts --title "$SCRAPER_TITLE"
          else
            cd scrapers/novel-worker && npx tsx src/index.ts
          fi
