name: Daily Audit Fix

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit fix all packages
        continue-on-error: true
        run: |
          for dir in backend frontend scrapers/cheerio-worker scrapers/import-worker scrapers/novel-worker scrapers/webtoons; do
            if [ -f "$dir/package.json" ]; then
              echo "=== Auditing $dir ==="
              cd "$dir" && npm audit fix --no-fund 2>&1 || true
              cd "$GITHUB_WORKSPACE"
            fi
          done

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: npm audit fix — daily"
          title: "chore: npm audit fix — daily"
          body: "Automatic `npm audit fix` run across all sub-projects."
          branch: "audit/daily-fix"
          base: "main"
          labels: "dependencies"
