name: Master Metadata Import

on:
  schedule:
    - cron: '0 3 * * *' # Tous les jours à 03h UTC
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore import offsets cache
        id: cache-offsets
        uses: actions/cache@v6
        with:
          path: /tmp/import_offsets.json
          key: import-offsets-${{ github.run_id }}
          restore-keys: import-offsets-

      - name: Install dependencies
        run: cd scrapers/import-worker && npm ci

      - name: Build
        run: cd scrapers/import-worker && npm run build

      - name: Run Importers
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          # TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          GUTENBERG_API_KEY: ${{ secrets.GUTENBERG_API_KEY }}
        run: cd scrapers/import-worker && npm start

      - name: Reconcile D1 (backfill missing entries)
        env:
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          curl -s -X POST "$INTERNAL_API_URL/ingest/reconcile" \
            -H "X-Internal-API-Key: $INTERNAL_API_KEY" \
            -H "Content-Type: application/json" | jq .
