name: Manual Orchestration

on:
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Orchestrator
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          curl -s -X POST "$CF_WORKER_URL/api/internal/orchestrate" \
            -H "X-Internal-API-Key: $INTERNAL_API_KEY" \
            -H "Content-Type: application/json" | tee response.json
          echo "---"
          cat response.json | jq .
          if [[ "$(cat response.json | jq -r '.success')" != "true" ]]; then
            echo "❌ Orchestration failed"
            exit 1
          fi
          echo "✅ Orchestration réussie"
