name: Webtoon Scraper
on:
  schedule:
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      title:
        description: 'Titre specifique a rechercher (optionnel)'
        required: false
        type: string

concurrency:
  group: webtoon-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Cloudflare Warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo systemctl start warp-svc
          sleep 2
          sudo warp-cli --accept-tos connect
          sleep 3
          sudo warp-cli --accept-tos status
          echo "Public IP: $(curl -s https://ifconfig.me)"
      - name: Install dependencies
        run: cd scrapers/webtoons && npm ci
      - name: Configure WARP egress
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          for var in SUPABASE_DATABASE_URL NEON_DATABASE_URL; do
            url="${!var}"
            host="$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$url")"
            echo "Excluding $host from WARP for direct database access"
            sudo warp-cli --accept-tos tunnel host add "$host" || true
            while read -r ip; do
              [ -n "$ip" ] && sudo warp-cli --accept-tos tunnel ip add "$ip" || true
            done < <(getent ahostsv4 "$host" | awk '{print $1}' | sort -u)
          done

          sudo warp-cli --accept-tos disconnect || true
          sleep 2
          sudo warp-cli --accept-tos connect || true
          sleep 5

          egress_ok=0
          for attempt in 1 2 3; do
            if curl -fsS --max-time 10 -o /dev/null https://www.google.com/generate_204 \
              && curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -q '^warp=on$'; then
              egress_ok=1
              break
            fi
            echo "WARP egress check failed (attempt $attempt/3), reconnecting"
            sudo warp-cli --accept-tos disconnect || true
            sleep 2
            sudo warp-cli --accept-tos connect || true
            sleep 5
          done

          if [ "$egress_ok" -ne 1 ]; then
            echo "WARP egress is not usable; aborting before claiming jobs"
            exit 1
          fi

          curl -fsS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on$'
      - name: Fetch stale webtoons from queue
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SCRAPER_TITLE: ${{ inputs.title || '' }}
        run: |
          if [ -n "$SCRAPER_TITLE" ]; then
            cd scrapers/webtoons && npx tsx src/worker.ts --title "$SCRAPER_TITLE"
          else
            cd scrapers/webtoons && npx tsx src/worker.ts --queue
          fi
