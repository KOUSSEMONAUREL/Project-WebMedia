name: Dynamic Scraper (Scrapling)

on:
  schedule:
    - cron: '20 8,14,20 * * *'
  workflow_dispatch:
    inputs:
      title:
        description: 'Titre specifique a rechercher (optionnel)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd scrapers/scrapling-worker
          pip install -r requirements.txt
          playwright install chromium
          patchright install chromium
        
      - name: Run Scraper
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          INTERNAL_API_URL: ${{ secrets.INTERNAL_API_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SCRAPER_TITLE: ${{ inputs.title || '' }}
        run: |
          if [ -n "$SCRAPER_TITLE" ]; then
            cd scrapers/scrapling-worker && python src/main.py --title "$SCRAPER_TITLE"
          else
            cd scrapers/scrapling-worker && python src/main.py
          fi
