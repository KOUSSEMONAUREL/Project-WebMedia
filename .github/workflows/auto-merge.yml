name: Dependabot Auto-Merge

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'scrapers/webtoons/package.json'
      - 'scrapers/webtoons/package-lock.json'
      - 'scrapers/novel-worker/package.json'
      - 'scrapers/novel-worker/package-lock.json'
      - 'scrapers/import-worker/package.json'
      - 'scrapers/import-worker/package-lock.json'
      - 'scrapers/scrapling-worker/requirements*.txt'

permissions:
  contents: read
  pull-requests: read

jobs:
  check-and-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dir: [backend, frontend, scrapers/webtoons, scrapers/novel-worker, scrapers/import-worker]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: cd ${{ matrix.dir }} && npm ci --legacy-peer-deps

      - name: TypeScript check (backend)
        if: matrix.dir == 'backend'
        run: cd ${{ matrix.dir }} && npx tsc --noEmit

      - name: Build (frontend)
        if: matrix.dir == 'frontend'
        env:
          PUBLIC_API_URL: http://127.0.0.1:8080
          PUBLIC_AUTH_URL: http://127.0.0.1:8080
        run: cd ${{ matrix.dir }} && npm run build

      - name: TypeScript check (scrapers)
        if: matrix.dir != 'backend' && matrix.dir != 'frontend'
        run: cd ${{ matrix.dir }} && npx tsc --noEmit

  merge:
    needs: check-and-merge
    if: github.actor == 'dependabot[bot]' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge patch/minor
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


