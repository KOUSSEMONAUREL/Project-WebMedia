name: Keiyoushi Upstream Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_agent:
        description: 'Forcer le job agent meme sans changements upstream (test)'
        type: boolean
        default: false

env:
  TSBASE: ${{ github.workspace }}/scrapers/webtoons/definitions/webtoons
  ANALYZER: ${{ github.workspace }}/scrapers/webtoons/sync/keiyoushi_analyze.py
  CLOUDFLARE_CHECK: ${{ github.workspace }}/scrapers/webtoons/sync/cloudflare_check.py
  PERSIST: ${{ github.workspace }}/scrapers/webtoons/sync/persist_commit.py

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    outputs:
      has_changes: ${{ steps.monitor.outputs.has_changes }}
      open_issue: ${{ steps.openissue.outputs.open_issue }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore last checked commit from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /tmp/keiyoushi_last_commit
          key: keiyoushi-commit-cache-${{ github.run_id }}
          restore-keys: keiyoushi-commit-cache-

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq postgresql-client

      - name: Check upstream for changes
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          STATE_FILE="/tmp/keiyoushi_last_commit"
          REPO_API="https://api.github.com/repos/keiyoushi/extensions-source"
          GH_HEADER="Authorization: Bearer $GH_TOKEN"
          persist_supabase() {
            local sha="$1"
            echo "$sha" > "$STATE_FILE"
            python3 "$PERSIST" write "$sha"
          }

          curl -sL -H "$GH_HEADER" "$REPO_API" -o /tmp/repo.json
          python3 -c "import json; d=json.load(open('/tmp/repo.json')); assert 'default_branch' in d" 2>/dev/null || { echo "Error: invalid repo API response"; cat /tmp/repo.json; exit 1; }
          DEFAULT_BRANCH=$(python3 -c "import json; print(json.load(open('/tmp/repo.json'))['default_branch'])")

          curl -sL -H "$GH_HEADER" "$REPO_API/branches/$DEFAULT_BRANCH" -o /tmp/branch.json
          python3 -c "import json; d=json.load(open('/tmp/branch.json')); assert 'commit' in d" 2>/dev/null || { echo "Error: invalid branch API response"; cat /tmp/branch.json; exit 1; }
          HEAD_SHA=$(python3 -c "import json; print(json.load(open('/tmp/branch.json'))['commit']['sha'])")

          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "HEAD distant: ${HEAD_SHA:0:8}"

          LAST_CHECKED=""
          [ -f "$STATE_FILE" ] && LAST_CHECKED=$(cat "$STATE_FILE")

          # Fallback Supabase si cache manquant
          if [ -z "$LAST_CHECKED" ] && [ -n "$SUPABASE_DATABASE_URL" ]; then
            LAST_CHECKED=$(python3 "$PERSIST" read)
            [ -n "$LAST_CHECKED" ] && echo "Restored from Supabase: ${LAST_CHECKED:0:8}"
          fi

          if [ -z "$LAST_CHECKED" ]; then
            persist_supabase "$HEAD_SHA"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Premier check HEAD ${HEAD_SHA:0:8} enregistre"
            exit 0
          fi

          if [ "$LAST_CHECKED" = "$HEAD_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Aucun changement (toujours ${HEAD_SHA:0:8})"
            persist_supabase "$HEAD_SHA"
            exit 0
          fi

          echo "Nouveaux commits: ${LAST_CHECKED:0:8} -> ${HEAD_SHA:0:8}"
          echo "last_checked=$LAST_CHECKED" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

          curl -sL -H "$GH_HEADER" "$REPO_API/compare/$LAST_CHECKED...$HEAD_SHA" -o /tmp/compare.json
          python3 -c "import json; d=json.load(open('/tmp/compare.json')); assert 'files' in d" 2>/dev/null || { echo "Error: invalid compare API response"; cat /tmp/compare.json; exit 1; }
          python3 "$ANALYZER" /tmp/compare.json "$LAST_CHECKED" "$HEAD_SHA"

          persist_supabase "$HEAD_SHA"

      - name: Check Cloudflare for new extensions
        if: steps.monitor.outputs.has_changes == 'true'
        env:
          HEAD_SHA: ${{ steps.monitor.outputs.head_sha }}
        run: |
          python3 "$CLOUDFLARE_CHECK"

      - name: Create or update issue
        if: steps.monitor.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_CHECKED="${{ steps.monitor.outputs.last_checked }}"
          HEAD_SHA="${{ steps.monitor.outputs.head_sha }}"
          RUN_ID="${{ github.run_id }}"

          if [ "${CRITICAL_CHANGED:-0}" -gt 0 ] || [ "${NEW_CHANGED:-0}" -gt 0 ]; then
            EXISTING=$(gh issue list \
              --label "keiyoushi-upstream" \
              --state open \
              --json number,title \
              --jq '.[] | select(.title | startswith("[Keiyoushi]")) | .number' \
              | head -1)

            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" \
                --body-file /tmp/keiyoushi_issue_body.md
            else
              gh issue create \
                --title "[Keiyoushi] Changements upstream ($(date +'%d/%m/%Y'))" \
                --label "keiyoushi-upstream" \
                --body-file /tmp/keiyoushi_issue_body.md
            fi
          else
            echo "Aucun changement critique ou nouveau. Pas d'issue creee."
          fi

      - name: Detecter les issues keiyoushi restees ouvertes
        id: openissue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh issue list \
            --label "keiyoushi-upstream" \
            --state open \
            --json number \
            --jq 'length' 2>/dev/null || echo 0)
          if [ "$COUNT" -gt 0 ]; then
            echo "open_issue=true" >> "$GITHUB_OUTPUT"
            echo "Issues keiyoushi ouvertes detectees: $COUNT -> agent declenche"
          else
            echo "open_issue=false" >> "$GITHUB_OUTPUT"
          fi

  agent-analysis:
    name: Agent - analyse et traitement de l'issue
    needs: check-upstream
    if: needs.check-upstream.outputs.has_changes == 'true' || github.event.inputs.force_agent == 'true' || needs.check-upstream.outputs.open_issue == 'true'
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: google/gemini-flash-latest
      PROMPT_FILE: ${{ github.workspace }}/.github/prompts/keiyoushi-analysis.md
      REVIEW_PROMPT_FILE: ${{ github.workspace }}/.github/prompts/keiyoushi-review.md
      SUBMIT_SCRIPT: ${{ github.workspace }}/scrapers/webtoons/sync/keiyoushi_submit.py
      MERGE_SCRIPT: ${{ github.workspace }}/scrapers/webtoons/sync/keiyoushi_merge.py
      VERIFY_SCRIPT: ${{ github.workspace }}/scrapers/webtoons/sync/keiyoushi_verify.py
      HANDOFF_FILE: /tmp/keiyoushi_handoff.json
      PR_LIST_FILE: /tmp/keiyoushi_prs.json
      REVIEW_FILE: /tmp/keiyoushi_review.json
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scrapers/webtoons/package-lock.json

      - name: Install dependencies
        run: cd scrapers/webtoons && npm ci

      - name: Install Cloudflare Warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new
          sudo systemctl start warp-svc
          sleep 2
          sudo warp-cli --accept-tos connect
          sleep 3
          sudo warp-cli --accept-tos status
          echo "Public IP: $(curl -s https://ifconfig.me)"

      - name: Installer opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: Trouver l'issue keiyoushi ouverte
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(gh issue list \
            --label "keiyoushi-upstream" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            echo "Aucune issue keiyoushi ouverte, rien a traiter."
            exit 0
          fi
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Resoudre les modeles vivants (zero dur)
        id: models
        if: steps.issue.outputs.issue_number != ''
        timeout-minutes: 10
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          python3 .github/scripts/resolve-models.py

      - name: Lancer l'agent (primary)
        id: primary
        if: steps.issue.outputs.issue_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          opencode run --model "$PRIMARY_MODEL" --variant max --thinking --auto \
            --file "$PROMPT_FILE" \
            -- "Analyze issue #$ISSUE_NUMBER following the procedure in the prompt."

      - name: Lancer l'agent (fallback 1)
        id: fallback
        if: steps.issue.outputs.issue_number != '' && steps.primary.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          echo "Primary model failed, switching to $FALLBACK_MODEL"
          opencode run --model "$FALLBACK_MODEL" --variant max --thinking --auto \
            --file "$PROMPT_FILE" \
            -- "Analyze issue #$ISSUE_NUMBER following the procedure in the prompt."

      - name: Lancer l'agent (fallback 2)
        id: fallback2
        if: steps.issue.outputs.issue_number != '' && steps.primary.outcome == 'failure' && steps.fallback.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          echo "fallback 1 failed, switching to $GEMINI_MODEL"
          opencode run --model "$GEMINI_MODEL" --auto \
            --file "$PROMPT_FILE" \
            -- "Analyze issue #$ISSUE_NUMBER following the procedure in the prompt."

      - name: Lancer l'agent (fallback 3)
        id: fallback3
        if: steps.issue.outputs.issue_number != '' && steps.primary.outcome == 'failure' && steps.fallback.outcome == 'failure' && steps.fallback2.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          echo "fallback 2 failed, switching to $FALLBACK3_MODEL"
          opencode run --model "$FALLBACK3_MODEL" --variant max --thinking --auto \
            --file "$PROMPT_FILE" \
            -- "Analyze issue #$ISSUE_NUMBER following the procedure in the prompt."

      - name: Lancer l'agent (fallback 4)
        id: fallback4
        if: steps.issue.outputs.issue_number != '' && steps.primary.outcome == 'failure' && steps.fallback.outcome == 'failure' && steps.fallback2.outcome == 'failure' && steps.fallback3.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          echo "fallback 3 failed, switching to $FALLBACK4_MODEL"
          opencode run --model "$FALLBACK4_MODEL" --variant max --thinking --auto \
            --file "$PROMPT_FILE" \
            -- "Analyze issue #$ISSUE_NUMBER following the procedure in the prompt."

      - name: Verifier le handoff produit
        id: handoff-check
        if: steps.issue.outputs.issue_number != ''
        env:
          HANDOFF_FILE: ${{ env.HANDOFF_FILE }}
        run: |
          if [ ! -s "$HANDOFF_FILE" ]; then
            echo "NO_HANDOFF: aucun fichier handoff produit par l'agent"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          elif ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$HANDOFF_FILE" 2>/dev/null; then
            echo "INVALID_HANDOFF: JSON illisible"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "Handoff valide: $(python3 -c "import json; h=json.load(open('$HANDOFF_FILE')); print('close=' + str(h.get('close')) + ', changes=' + str(len(h.get('changes', []))))")"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Soumettre (branches, commits, PRs)
        if: steps.issue.outputs.issue_number != '' && steps.handoff-check.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          python3 "$SUBMIT_SCRIPT"

      - name: Verifier les PRs (reviewer)
        id: review
        if: steps.issue.outputs.issue_number != '' && steps.handoff-check.outputs.valid == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          opencode run --model "$FALLBACK_MODEL" --variant max --thinking --auto \
            --file "$REVIEW_PROMPT_FILE" \
            -- "Review the PRs listed in $PR_LIST_FILE following the reviewer prompt (verdict per PR). Also read the handoff at $HANDOFF_FILE: IGNORE/NO_IMPACT entries are resolved verdicts, they never FAIL a PR. Independent verification, like a human senior engineer: fetch upstream Kotlin source and check our TS scraper matches exactly. FAIL only on a PR's own failed checks."
        shell: bash

      - name: Verifier les PRs (reviewer fallback 2)
        id: review-fallback2
        if: steps.issue.outputs.issue_number != '' && steps.handoff-check.outputs.valid == 'true' && steps.review.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          echo "Reviewer model failed, switching to $GEMINI_MODEL"
          opencode run --model "$GEMINI_MODEL" --auto \
            --file "$REVIEW_PROMPT_FILE" \
            -- "Review the PRs listed in $PR_LIST_FILE following the reviewer prompt (verdict per PR). Also read the handoff at $HANDOFF_FILE: IGNORE/NO_IMPACT entries are resolved verdicts, they never FAIL a PR. Independently verify each scraper against upstream Kotlin: diff must match exactly. FAIL only on a PR's own failed checks."

      - name: Verifier les PRs (reviewer fallback 3)
        id: review-fallback3
        if: steps.issue.outputs.issue_number != '' && steps.handoff-check.outputs.valid == 'true' && steps.review.outcome == 'failure' && steps.review-fallback2.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          echo "fallback 2 failed, switching to $FALLBACK3_MODEL"
          opencode run --model "$FALLBACK3_MODEL" --variant max --thinking --auto \
            --file "$REVIEW_PROMPT_FILE" \
            -- "Review the PRs listed in $PR_LIST_FILE following the reviewer prompt (verdict per PR). Also read the handoff at $HANDOFF_FILE: IGNORE/NO_IMPACT entries are resolved verdicts, they never FAIL a PR. Verify scraper fidelity against upstream Kotlin. FAIL only on a PR's own failed checks."

      - name: Verifier les PRs (reviewer fallback 4)
        id: review-fallback4
        if: steps.issue.outputs.issue_number != '' && steps.handoff-check.outputs.valid == 'true' && steps.review.outcome == 'failure' && steps.review-fallback2.outcome == 'failure' && steps.review-fallback3.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          echo "fallback 3 failed, switching to $FALLBACK4_MODEL"
          opencode run --model "$FALLBACK4_MODEL" --variant max --thinking --auto \
            --file "$REVIEW_PROMPT_FILE" \
            -- "Review the PRs listed in $PR_LIST_FILE following the reviewer prompt (verdict per PR). Also read the handoff at $HANDOFF_FILE: IGNORE/NO_IMPACT entries are resolved verdicts, they never FAIL a PR. Verify scraper fidelity against upstream Kotlin. FAIL only on a PR's own failed checks."

      - name: Appliquer verdicts et merger
        if: steps.issue.outputs.issue_number != '' && steps.handoff-check.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          python3 "$MERGE_SCRIPT"

      - name: Verification finale (independante de l'agent)
        if: always() && steps.issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          python3 "$VERIFY_SCRIPT"
