name: Keiyoushi Upstream Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  TSBASE: ${{ github.workspace }}/scrapers/webtoons/definitions/webtoons
  ANALYZER: ${{ github.workspace }}/scrapers/webtoons/sync/keiyoushi_analyze.py
  PERSIST: ${{ github.workspace }}/scrapers/webtoons/sync/persist_commit.py

permissions:
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore last checked commit from cache
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/keiyoushi_last_commit
          key: keiyoushi-commit-cache-${{ github.run_id }}
          restore-keys: keiyoushi-commit-cache-

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq 2>/dev/null || true
          sudo apt-get install -y -qq postgresql-client

      - name: Check upstream for changes
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          STATE_FILE="/tmp/keiyoushi_last_commit"
          REPO_API="https://api.github.com/repos/keiyoushi/extensions-source"
          GH_HEADER="Authorization: Bearer $GH_TOKEN"
          persist_supabase() {
            local sha="$1"
            echo "$sha" > "$STATE_FILE"
            python3 "$PERSIST" write "$sha"
          }

          curl -sL -H "$GH_HEADER" "$REPO_API" -o /tmp/repo.json
          python3 -c "import json; d=json.load(open('/tmp/repo.json')); assert 'default_branch' in d" 2>/dev/null || { echo "Error: invalid repo API response"; cat /tmp/repo.json; exit 1; }
          DEFAULT_BRANCH=$(python3 -c "import json; print(json.load(open('/tmp/repo.json'))['default_branch'])")

          curl -sL -H "$GH_HEADER" "$REPO_API/branches/$DEFAULT_BRANCH" -o /tmp/branch.json
          python3 -c "import json; d=json.load(open('/tmp/branch.json')); assert 'commit' in d" 2>/dev/null || { echo "Error: invalid branch API response"; cat /tmp/branch.json; exit 1; }
          HEAD_SHA=$(python3 -c "import json; print(json.load(open('/tmp/branch.json'))['commit']['sha'])")

          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
          echo "HEAD distant: ${HEAD_SHA:0:8}"

          LAST_CHECKED=""
          [ -f "$STATE_FILE" ] && LAST_CHECKED=$(cat "$STATE_FILE")

          # Fallback Supabase si cache manquant
          if [ -z "$LAST_CHECKED" ] && [ -n "$SUPABASE_DATABASE_URL" ]; then
            LAST_CHECKED=$(python3 "$PERSIST" read)
            [ -n "$LAST_CHECKED" ] && echo "Restored from Supabase: ${LAST_CHECKED:0:8}"
          fi

          if [ -z "$LAST_CHECKED" ]; then
            persist_supabase "$HEAD_SHA"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Premier check HEAD ${HEAD_SHA:0:8} enregistre"
            exit 0
          fi

          if [ "$LAST_CHECKED" = "$HEAD_SHA" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Aucun changement (toujours ${HEAD_SHA:0:8})"
            persist_supabase "$HEAD_SHA"
            exit 0
          fi

          echo "Nouveaux commits: ${LAST_CHECKED:0:8} -> ${HEAD_SHA:0:8}"
          echo "last_checked=$LAST_CHECKED" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

          curl -sL -H "$GH_HEADER" "$REPO_API/compare/$LAST_CHECKED...$HEAD_SHA" -o /tmp/compare.json
          python3 -c "import json; d=json.load(open('/tmp/compare.json')); assert 'files' in d" 2>/dev/null || { echo "Error: invalid compare API response"; cat /tmp/compare.json; exit 1; }
          python3 "$ANALYZER" /tmp/compare.json "$LAST_CHECKED" "$HEAD_SHA"

          persist_supabase "$HEAD_SHA"

      - name: Check Cloudflare for new extensions
        if: steps.monitor.outputs.has_changes == 'true'
        shell: bash
        run: |
          if [ ! -f /tmp/keiyoushi_new_extensions.json ]; then
            echo "No new extensions to check"
            exit 0
          fi

          # Read new extensions, try to fetch missing baseUrls from upstream raw
          HEAD_SHA="${{ steps.monitor.outputs.head_sha }}"
          python3 -u -c "
import json, subprocess, os, re

with open('/tmp/keiyoushi_new_extensions.json') as f:
    exts = json.load(f)
with open('/tmp/keiyoushi_issue_body.md') as f:
    body = f.read()

head_sha = os.environ.get('HEAD_SHA', '')
UPSTREAM_RAW = f'https://raw.githubusercontent.com/keiyoushi/extensions-source/{head_sha}'

results = {}
for ext in exts:
    url = ext.get('baseUrl')

    # If baseUrl not found in patch, try to fetch build.gradle.kts from raw
    if not url:
        lang = ext.get('lang', 'all')
        ext_name = ext['key'].split('/')[1]
        build_url = f'{UPSTREAM_RAW}/src/{lang}/{ext_name}/build.gradle.kts'
        try:
            r = subprocess.run(
                ['curl', '-sL', '--max-time', '8', build_url],
                capture_output=True, text=True, timeout=12
            )
            if r.returncode == 0:
                content = r.stdout
                # Old format: baseUrl = "..."
                for line in content.split('\n'):
                    m = re.search(r'baseUrl\s*=\s*\"([^\"]+)\"', line)
                    if m:
                        url = m.group(1)
                        ext['baseUrl'] = url
                        break
                # New DSL format: baseUrl { mirrors("...", ...) } or custom("...")
                if not url:
                    in_block = False
                    for line in content.split('\n'):
                        if re.search(r'baseUrl\s*\{', line):
                            in_block = True
                            continue
                        if in_block:
                            if line.strip() == '}':
                                break
                            m = re.search(r'\"(https?://[^\"]+)\"', line)
                            if m:
                                url = m.group(1)
                                ext['baseUrl'] = url
                                break
        except Exception:
            pass

    if not url:
        results[ext['key']] = 'URL inconnue'
        continue

    if '127.0.0.1' in url or 'localhost' in url:
        results[ext['key']] = 'NON (local)'
        continue

    if not url.startswith('http'):
        url = 'https://' + url

    try:
        r = subprocess.run(
            ['curl', '-sI', '--max-time', '10', url],
            capture_output=True, text=True, timeout=15
        )
        headers = r.stdout.lower()
        if 'cloudflare' in headers or 'cf-ray' in headers:
            results[ext['key']] = 'OUI (Cloudflare)'
        else:
            server = ''
            for line in r.stdout.split('\n'):
                if line.lower().startswith('server:'):
                    server = line.split(':', 1)[1].strip()
                    break
            results[ext['key']] = f'NON ({server or \"accessible\"})'
    except subprocess.TimeoutExpired:
        results[ext['key']] = 'TIMEOUT'
    except Exception as exc:
        results[ext['key']] = f'ERREUR: {str(exc)[:60]}'

    print(f'{ext[\"key\"]}: {results[ext[\"key\"]]}')

# Update issue body: replace _(verification...)_ with actual results + update URL column if missing
lines = body.split('\n')
for i, line in enumerate(lines):
    for key, status in results.items():
        if key in line and '_(verification...)_' in line:
            # Also fill URL column if it was previously empty
            new_url = None
            for ext in exts:
                if ext['key'] == key:
                    new_url = ext.get('baseUrl')
                    break
            if new_url and '| - | _(verification...)_' in line:
                lines[i] = line.replace('| - | _(verification...)_', f'| {new_url} | {status}')
            else:
                lines[i] = line.replace('_(verification...)_', status)
            break
body = '\n'.join(lines)

with open('/tmp/keiyoushi_issue_body.md', 'w') as f:
    f.write(body)
"

      - name: Create or update issue
        if: steps.monitor.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_CHECKED="${{ steps.monitor.outputs.last_checked }}"
          HEAD_SHA="${{ steps.monitor.outputs.head_sha }}"
          RUN_ID="${{ github.run_id }}"

          if [ "${CRITICAL_CHANGED:-0}" -gt 0 ] || [ "${NEW_CHANGED:-0}" -gt 0 ]; then
            EXISTING=$(gh issue list \
              --label "keiyoushi-upstream" \
              --state open \
              --json number,title \
              --jq '.[] | select(.title | startswith("[Keiyoushi]")) | .number' \
              | head -1)

            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" \
                --body-file /tmp/keiyoushi_issue_body.md
            else
              gh issue create \
                --title "[Keiyoushi] Changements upstream ($(date +'%d/%m/%Y'))" \
                --label "keiyoushi-upstream" \
                --body-file /tmp/keiyoushi_issue_body.md
            fi
          else
            echo "Aucun changement critique ou nouveau. Pas d'issue creee."
          fi
